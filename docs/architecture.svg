<svg width="680" height="410" viewBox="0 0 680 410" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>S.P.E.A.K. architecture overview</title>
<desc>A browser client, FastAPI edge service, and local storage all run on the clinic device. The edge service optionally sends masked text to a cloud LLM for structuring.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="410" fill="#ffffff"/>

<!-- Outer container: Local clinic device -->
<rect x="40" y="40" width="600" height="220" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="60" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Local clinic device</text>
<text x="60" y="82" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Runs fully offline</text>

<!-- Browser client -->
<rect x="60" y="100" width="170" height="140" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="145" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Browser client</text>
<text x="145" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#185FA5">Dictation &amp; audio</text>

<!-- FastAPI service -->
<rect x="255" y="100" width="170" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">FastAPI service</text>
<text x="340" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0F6E56">Speech + masking</text>

<!-- Local storage -->
<rect x="450" y="100" width="170" height="140" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="535" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#633806">Local storage</text>
<text x="535" y="148" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#854F0B">Encrypted records</text>

<!-- Connectors -->
<line x1="230" y1="170" x2="253" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="425" y1="170" x2="448" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- External optional cloud LLM -->
<rect x="250" y="310" width="180" height="60" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="340" y="333" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Cloud LLM</text>
<text x="340" y="351" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">Optional structuring</text>

<line x1="340" y1="240" x2="340" y2="308" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-dashed)"/>
<text x="360" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">masked text</text>
<text x="360" y="292" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#444441">only</text>
</svg>
